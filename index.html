<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Design SMA aggregate blends with the Bailey Method, log lab trials and get the next blend to try. Runs in your browser.">
<title>Bailey Design Trials</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2320262B'/%3E%3Cpath d='M5 26 C12 25 15 12 27 6' stroke='%23C98328' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="web/style.css?v=1">
</head>
<body>
<header class="topbar">
  <button class="brand" id="go-home" title="All mixes">
    <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M2 21 C12 20 18 6 38 3" /><circle cx="15" cy="13.6" r="2.2"/></svg>
    <span>Bailey Design Trials</span>
  </button>
  <div class="mixbar" id="mixbar" hidden>
    <span class="mixname" id="mix-title"></span>
    <span class="chip" id="units-chip"></span>
    <span class="chip" id="nmas-chip"></span>
  </div>
  <div class="savestate" id="savestate" aria-live="polite"></div>
  <button class="btn small savebtn" id="save-now" title="Save now (Ctrl+S)" hidden>Save</button>
</header>

<main id="app">
  <div class="boot">
    <h1>Bailey Design Trials</h1>
    <p>Loading the calculation engine. The first visit takes a few seconds. After that it is cached.</p>
    <div class="bar"><i></i></div>
    <noscript><p class="err">This tool needs JavaScript.</p></noscript>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script>window.BDT_VERSION = "1";</script>
<script src="web/webapi.js?v=1"></script>
<script src="web/app.js?v=1"></script>
</body>
</html>
